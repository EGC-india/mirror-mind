name: Build and Deploy MirrorMind to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: egc-india/mirrormind-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command_timeout: 30m
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_CONTENT, GH_TOKEN
          script: |
            mkdir -p ~/mirrormind-app
            cd ~/mirrormind-app

            # Clone or update code for docker-compose.yml
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${GH_TOKEN}@github.com/EGC-india/mirror-mind.git
              git fetch --all
              git reset --hard origin/master
            else
              git remote set-url origin https://${GH_TOKEN}@github.com/EGC-india/mirror-mind.git
              git fetch --all
              git reset --hard origin/master
              git pull origin master
            fi

            # Safe way to write multi-line content from a variable
            printf "%s" "$ENV_CONTENT" > .env

            # Login to GitHub Container Registry using the GitHub token
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u github-actions --password-stdin

            # Pull the pre-built image instead of building locally
            sudo docker compose pull

            # Start the containers
            sudo docker compose up -d

            # Prune old images to save space
            sudo docker image prune -a -f
            sudo docker builder prune -f
